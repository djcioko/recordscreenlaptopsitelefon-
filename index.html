<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Nervobiții - Studio & Screen Recorder</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--blue:#7ecbff;--blue2:#b9e4ff;--red:#c1392b;--text:#eaf6ff;--muted:#9bb6c9;--line:#1c3344}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,serif}
button,input{font-family:inherit}
.app{max-width:960px;margin:0 auto;min-height:100%;background:linear-gradient(#0b1a24,#071018);padding-bottom:70px}
.topbar{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{letter-spacing:.16em;font-size:14px;color:var(--blue2);font-weight:bold}
.screen{display:none;padding:12px}
.screen.active{display:block}
h1,h2{font-weight:500;color:var(--blue2)}
h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:8px 0}
.muted{color:var(--muted);font-size:12px;line-height:1.35}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #5aa0d0;background:linear-gradient(#3a7eb0,#1d4e73);color:#eaf6ff;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.btn.primary,.btn.full{width:100%}
.btn.primary{margin-top:8px;background:linear-gradient(#4aa0d8,#21608f)}
.btn.danger{border-color:#7a2a22;color:#f3c2bc;background:linear-gradient(#5a2a28,#2a1514)}
.btn.green{border-color:#2d6a3c;color:#b6f0c6}
.btn.on{outline:2px solid #7ecbff;background:linear-gradient(#21608f,#10304a)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;background:#071018;border:1px solid #2a5570;color:var(--text);padding:10px;border-radius:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}

/* Studio & Screen Recorder Layout (Orizontal / Adaptiv) */
.studio{position:relative;width:100%;aspect-ratio:16/9;max-height:75vh;background:#000;border-radius:14px;overflow:hidden;border:1px solid #2a5570}
.studio canvas{width:100%;height:100%;object-fit:cover;display:block}
.studio video.raw{position:absolute;opacity:0;pointer-events:none}
.count{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:64px;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none}
.timer{position:absolute;right:12px;top:12px;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:8px;color:#fff;font-size:13px;pointer-events:none;border:1px solid var(--line)}

.tools{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:8px;margin-top:12px}
.tools.hide{display:none}
.tools .btn{font-size:12px;padding:9px}
.rec-row{display:flex;justify-content:center;margin-top:10px}
.rec-btn{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#c1392b;cursor:pointer;transition:0.2s}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn.rec{background:#fff;border-color:#c1392b;border-radius:14px;width:40px;height:40px}

.gifts{display:flex;justify-content:center;gap:16px;margin-top:8px}
.gifts.hide{display:none}
.gift{text-align:center;font-size:10px;color:#cfe8f8;cursor:pointer}
.gift span{font-size:16px;display:block}

.hide-btn{position:absolute;left:12px;top:12px;z-index:6;width:50px;height:28px;border-radius:8px;border:1px solid #7ecbff;background:#0d1822cc;color:#b9e4ff;font-size:10px;cursor:pointer}
.scenes{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.scenes button{flex:0 0 130px;padding:0;border:2px solid #2a5570;border-radius:8px;overflow:hidden;background:#071018;cursor:pointer}
.scenes button.on{border-color:#7ecbff}
.scenes img{width:100%;height:65px;object-fit:cover;display:block;filter:brightness(1.14)}
.scene-lab{font-size:10px;text-align:center;padding:3px;color:#b9e4ff}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:960px;display:grid;grid-template-columns:repeat(2,1fr);background:#071018ee;border-top:1px solid var(--line);z-index:100}
.nav button{background:none;border:0;color:var(--muted);padding:12px;font-size:13px;cursor:pointer}
.nav button.active{color:var(--blue2);font-weight:bold}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#123044;color:#b9e4ff;padding:10px 18px;border-radius:20px;font-size:13px;display:none;z-index:999;border:1px solid var(--blue)}
video.preview{width:100%;border-radius:12px;background:#000;max-height:400px}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo">NERVOBIȚII - REC STUDIO</div>
  <div class="chip" id="userChip" style="font-size:12px;color:var(--blue)">Creator</div>
</header>

<!-- STUDIO & SCREEN RECORDER SCREEN -->
<section id="studio" class="screen active">
  <div class="studio" id="stageBox">
    <video id="cam" class="raw" playsinline muted></video>
    <video id="screenShareVid" class="raw" playsinline autoplay muted></video>
    <canvas id="stage"></canvas>
    <button class="hide-btn" id="btnHide">SHOW</button>
    <div class="timer" id="recTimer">00:00 / 10:00</div>
    <div class="count" id="count"></div>
  </div>

  <div class="rec-row"><button class="rec-btn" id="recBtn" title="Start/Stop Inregistrare"></button></div>

  <div class="gifts" id="giftsBar">
    <div class="gift" data-gift="trandafiri"><span>🌹</span>x10</div>
    <div class="gift" data-gift="gogoasa"><span>🍩</span>gogoașă</div>
    <div class="gift" data-gift="palarie"><span>🎩</span>pălărie</div>
  </div>

  <div class="tools" id="tools">
    <button class="btn on" id="btnMic">🎙 Mic ON</button>
    <button class="btn primary" id="btnShareScreen">🖥️ Share Screen</button>
    <button class="btn" id="btnCrop">AI Crop OFF</button>
    <button class="btn" id="btnBg">AI CUT OFF</button>
    <button class="btn" id="btnMask">Masca: Fără</button>
    <button class="btn" id="btnBody">Corp: Om</button>
    <button class="btn" id="btnPrivacy">Privacy: Față reală</button>
    <button class="btn" id="btnUploadMask">Upload mască</button>
    <button class="btn" id="btnUploadBg">Upload fundal foto</button>
    <button class="btn" id="btnCam">Alege cameră</button>
  </div>

  <p class="muted" style="margin-top:10px">Schimbă scena fundal sau imaginea încărcată</p>
  <div class="scenes" id="scenes"></div>

  <div class="field">
    <label>Logo pe ecran (gol = fără logo)</label>
    <input id="logoText" maxlength="35" placeholder="Nume sau titlu tutorial"/>
  </div>

  <input type="file" id="fileMaskInput" accept="image/*" hidden/>
  <input type="file" id="fileBgInput" accept="image/*" hidden/>
</section>

<!-- PREVIEW SCREEN -->
<section id="preview" class="screen">
  <h2>Înregistrare finalizată (MP4 / WebM)</h2>
  <video id="previewVid" class="preview" controls></video>
  <div class="field"><label>Titlu tutorial / clip</label><input id="titlu" placeholder="Nume fișier export"/></div>
  <div class="row" style="margin-top:10px">
    <button class="btn green full" id="btnDownload">Descarcă MP4 / WebM</button>
    <button class="btn danger full" id="btnDelete">Șterge / Refă</button>
  </div>
</section>

<!-- NAVIGATION BAR -->
<nav class="nav">
  <button data-go="studio" class="active">Studio & Rec</button>
  <button data-go="preview">Previzualizare</button>
</nav>

<div class="toast" id="toast"></div>
</div>

// Stare aplicație
let state = {
  activeScreen: 'studio',
  userChip: 'Creator',
  recTime: 0,
  isRec: false,
  isHide: false,
  currentScene: 0,
  logoText: '',
  micOn: true,
  aiCrop: false,
  aiCut: false,
  mask: 'Fără',
  body: 'Om',
  privacy: 'Față reală',
  customMaskUrl: null,
  customBgUrl: null,
  selectedCam: 0,
  stream: null,
  screenStream: null
};

// Notificări Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// Navigare
function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  
  const target = document.getElementById(screenId);
  if (target) target.classList.add('active');
  
  const navBtn = document.querySelector(`.nav button[data-go="${screenId}"]`);
  if (navBtn) navBtn.classList.add('active');
  
  state.activeScreen = screenId;
}

document.querySelectorAll('[data-go]').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.getAttribute('data-go')));
});

// Randare scene
const scenesContainer = document.getElementById('scenes');
SCENES.forEach((sc, idx) => {
  const btn = document.createElement('button');
  if(idx === state.currentScene) btn.classList.add('on');
  btn.innerHTML = `<img src="${sc.src}"><div class="scene-lab">${sc.name}</div>`;
  btn.addEventListener('click', () => {
    state.currentScene = idx;
    state.customBgUrl = null;
    document.querySelectorAll('.scenes button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    showToast(`Scenă fundal: ${sc.name}`);
  });
  scenesContainer.appendChild(btn);
});

// Ascundere UI (SHOW / HIDE)
let hiddenUI = false;
document.getElementById('btnHide').addEventListener('click', () => {
  hiddenUI = !hiddenUI;
  document.getElementById('tools').classList.toggle('hide', hiddenUI);
  document.getElementById('giftsBar').classList.toggle('hide', hiddenUI);
  document.getElementById('btnHide').textContent = hiddenUI ? 'HIDE' : 'SHOW';
});

// Inițializare Cameră Web
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
    state.stream = stream;
    const camVid = document.getElementById('cam');
    camVid.srcObject = stream;
    camVid.play();
  } catch(e) {
    console.error("Erore cameră:", e);
    showToast('Nu s-a putut accesa camera.');
  }
}
initCamera();

// Funcționalitate Share Screen
const screenVid = document.getElementById('screenShareVid');
document.getElementById('btnShareScreen').addEventListener('click', async () => {
  try {
    const screenStream = await navigator.mediaDevices.getDisplayMedia({video: true, audio: true});
    state.screenStream = screenStream;
    screenVid.srcObject = screenStream;
    screenVid.play();
    document.getElementById('btnShareScreen').classList.add('on');
    showToast('Share Screen activat!');

    // Când utilizatorul oprește partajarea din bara browserului
    screenStream.getVideoTracks()[0].onended = () => {
      stopScreenShare();
    };
  } catch(e) {
    showToast('Partajarea ecranului a fost anulată sau a eșuat.');
  }
});

function stopScreenShare() {
  if(state.screenStream) {
    state.screenStream.getTracks().forEach(t => t.stop());
    state.screenStream = null;
  }
  screenVid.srcObject = null;
  document.getElementById('btnShareScreen').classList.remove('on');
  showToast('Share Screen oprit.');
}

// Upload Fundal Foto

document.getElementById('btnUploadBg').addEventListener('click', () => fileBgInput.click());

// Înregistrare video (Max 10 minute, MP4/WebM compatibil, avertisment la minutul 9)
let mediaRecorder;
let recordedChunks = [];
let isRecording = false;
let recStartTime = 0;
let timerInterval = null;

const recBtn = document.getElementById('recBtn');
recBtn.addEventListener('click', () => {
  if(!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  recordedChunks = [];
  const canvasStream = canvas.captureStream(30); // 30 fps
  
  // Combinăm sunetul de la mic sau screen stream dacă există
  let combinedStream = canvasStream;
  if(state.stream) {
    const audioTracks = state.stream.getAudioTracks();
    if(audioTracks.length > 0) {
      audioTracks.forEach(track => combinedStream.addTrack(track));
    }
  }

  try {
    // Încercăm formatul standard MP4/WebM compatibil
    let options = { mimeType: 'video/mp4' };
    if (!MediaRecorder.isTypeSupported('video/mp4')) {
      options = { mimeType: 'video/webm;codecs=vp9,opus' };
    }

    mediaRecorder = new MediaRecorder(combinedStream, options);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      const url = URL.createObjectURL(blob);
      document.getElementById('previewVid').src = url;
      goTo('preview');
    };
    
    mediaRecorder.start(1000);
    isRecording = true;
    recBtn.classList.add('rec');
    recStartTime = Date.now();
    
    // Timer 10 minute + avertisment la minutul 9
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = `${mins}:${secs} / 10:00`;

      if(elapsed === 540) { // Minutul 9 (540 secunde)
        showToast('⚠️ ATENȚIE: Mai aveți 1 minut din limita de 10 minute!');
      }
      if(elapsed >= 600) { // 10 minute maxim
        stopRecording();
        showToast('Limita de 10 minute a fost atinsă. Înregistrare oprită automat.');
      }
    }, 1000);

    showToast('Înregistrare pornită (Mod Screen Recorder)');
  } catch(e) {
    console.error(e);
    showToast('Erore la pornirea înregistrării.');
  }
}

function stopRecording() {
  if(mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    recBtn.classList.remove('rec');
    clearInterval(timerInterval);
    showToast('Înregistrare finalizată cu succes!');
  }
}

// Randare Canvas Studio (Fundal orizontal + Ecran partajat / Cameră cropată)
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const camVid = document.getElementById('cam');

function drawStudio() {
  canvas.width = canvas.clientWidth || 1280;
  canvas.height = canvas.clientHeight || 720;
  
  // 1. Desenează Fundalul (Scena sau imaginea încărcată custom)
  const bgImg = new Image();
  if(state.customBgUrl) {
    bgImg.src = state.customBgUrl;
  } else {
    bgImg.src = SCENES[state.currentScene].src;
  }
  ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
  
  // 2. Dacă e activ Screen Share, desenăm ecranul partajat pe fundal/principal
  if(state.screenStream && screenVid.readyState === screenVid.HAVE_ENOUGH_DATA) {
    ctx.drawImage(screenVid, 0, 0, canvas.width, canvas.height);
  }

  // 3. Desenează Camera Web (Cropată / PIP în colțul din dreapta-jos sau stânga)
  if(camVid.readyState === camVid.HAVE_ENOUGH_DATA) {
    const pipW = canvas.width * 0.28;
    const pipH = canvas.height * 0.32;
    const pipX = canvas.width - pipW - 20;
    const pipY = canvas.height - pipH - 20;

    // Umbră și cadru pentru camera cropată
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(pipX, pipY, pipW, pipH, 12);
    ctx.clip();
    ctx.drawImage(camVid, pipX, pipY, pipW, pipH);
    ctx.restore();

    // Contur fin pe cadru PIP
    ctx.strokeStyle = '#7ecbff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(pipX, pipY, pipW, pipH, 12);
    ctx.stroke();
  }
  
  // 4. Logo / Text pe ecran
  const logoInput = document.getElementById('logoText').value || state.logoText;
  if(logoInput) {
    ctx.fillStyle = '#b9e4ff';
    ctx.font = 'bold 16px Georgia';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.fillText(logoInput, 24, 36);
    ctx.shadowBlur = 0; // reset
  }
  
  requestAnimationFrame(drawStudio);
}
requestAnimationFrame(drawStudio);

// Descărcare fișier
document.getElementById('btnDownload').addEventListener('click', () => {
  const vid = document.getElementById('previewVid');
  if(!vid.src) return;
  const a = document.createElement('a');
  a.href = vid.src;
  const title = document.getElementById('titlu').value.trim() || 'tutorial-nervobizii';
  a.download = `${title}.mp4`;
  a.click();
  showToast('Se descarcă fișierul video...');
});

document.getElementById('btnDelete').addEventListener('click', () => {
  document.getElementById('previewVid').src = '';
  goTo('studio');
  showToast('Pregătit pentru o nouă înregistrare.');
});

// Comenzi unelte
document.getElementById('btnMic').addEventListener('click', (e) => {
  state.micOn = !state.micOn;
  e.target.classList.toggle('on', state.micOn);
  e.target.textContent = state.micOn ? '🎙 Mic ON' : '🎙 Mic OFF';
  if(state.stream) {
    state.stream.getAudioTracks().forEach(track => track.enabled = state.micOn);
  }
  showToast(state.micOn ? 'Microfon activat' : 'Microfon dezactivat');
});
