<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Nervobiții - Studio & Screen Recorder Pro</title>
<style>
:root{--bg:#03070b;--panel:#0a141d;--blue:#7ecbff;--blue2:#b9e4ff;--red:#c1392b;--text:#eaf6ff;--muted:#9bb6c9;--line:#1c3344}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;width:100vw}
.screen{display:none;flex:1;flex-direction:column;position:relative;background:#000;overflow:hidden}
.screen.active{display:flex}

.studio{position:relative;flex:1;width:100%;height:100%;background:#000;overflow:hidden}
.studio canvas{width:100%;height:100%;display:block;background:#000}
.studio video.raw{position:absolute;opacity:0;pointer-events:none}

.timer{position:absolute;right:16px;top:16px;background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:8px;color:#fff;font-size:14px;border:1px solid var(--line);z-index:15}

.control-panel{position:absolute;bottom:0;left:0;width:100%;background:rgba(10,20,29,0.9);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px;z-index:25;transition:transform 0.3s ease}
.control-panel.hidden{transform:translateY(100%)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.btn{border:1px solid #5aa0d0;background:linear-gradient(#3a7eb0,#1d4e73);color:#eaf6ff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:linear-gradient(#4aa0d8,#21608f)}
.btn.danger{border-color:#7a2a22;color:#f3c2bc;background:linear-gradient(#5a2a28,#2a1514)}
.btn.green{border-color:#2d6a3c;color:#b6f0c6}
.btn.on{outline:2px solid #7ecbff;background:linear-gradient(#21608f,#10304a)}

.rec-row{display:flex;align-items:center;justify-content:center;gap:20px}
.rec-btn{width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:#c1392b;cursor:pointer;transition:0.2s}
.rec-btn:hover{transform:scale(1.05)}
.rec-btn.rec{background:#fff;border-color:#c1392b;border-radius:10px;width:32px;height:32px}

.vumeter-box{display:flex;align-items:center;gap:8px;background:#03070b;padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
.vumeter-bar{width:100px;height:10px;background:#1c3344;border-radius:5px;overflow:hidden}
.vumeter-fill{height:100%;width:0%;background:linear-gradient(90deg, #2d6a3c, #f1c40f, #c1392b);transition:width 0.05s linear}

.hide-btn{position:absolute;left:16px;top:16px;z-index:30;padding:6px 14px;border-radius:8px;border:1px solid #7ecbff;background:rgba(13,24,34,0.8);color:#b9e4ff;font-size:11px;cursor:pointer}

.nav{display:grid;grid-template-columns:repeat(2,1fr);background:#071018;border-top:1px solid var(--line)}
.nav button{background:none;border:0;color:var(--muted);padding:10px;font-size:12px;cursor:pointer}
.nav button.active{color:var(--blue2);font-weight:bold}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#123044;color:#b9e4ff;padding:8px 16px;border-radius:20px;font-size:12px;display:none;z-index:999;border:1px solid var(--blue)}
video.preview{width:100%;border-radius:8px;background:#000;max-height:450px;object-fit:contain}
.preview-container{padding:20px;display:flex;flex-direction:column;gap:12px;max-width:900px;margin:0 auto;width:100%;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted)}
.field input{background:#071018;border:1px solid #2a5570;color:var(--text);padding:8px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div class="app">

<!-- STUDIO SCREEN -->
<section id="studio" class="screen active">
  <div class="studio" id="stageBox">
    <video id="cam" class="raw" playsinline muted></video>
    <video id="screenShareVid" class="raw" playsinline autoplay muted></video>
    <canvas id="stage"></canvas>
    
    <button class="hide-btn" id="btnHide">ASCUNDE CONTROALE</button>
    <div class="timer" id="recTimer">00:00 / 10:00</div>
  </div>

  <div class="control-panel" id="controlPanel">
    <div class="rec-row">
      <button class="btn on" id="btnMic">🎙 Mic ON</button>
      
      <div class="vumeter-box">
        <span style="font-size:10px;color:var(--muted)">VU:</span>
        <div class="vumeter-bar"><div class="vumeter-fill" id="vuFill"></div></div>
      </div>

      <button class="rec-btn" id="recBtn" title="Start/Stop Inregistrare"></button>
      <button class="btn primary" id="btnShareScreen">🖥️ Share Screen Full HD</button>
      <button class="btn" id="btnAiCut">AI CUT OFF</button>
    </div>
  </div>
</section>

<!-- PREVIEW SCREEN -->
<section id="preview" class="screen" style="background:var(--bg)">
  <div class="preview-container">
    <h2>Înregistrare finalizată (MP4 / WebM)</h2>
    <video id="previewVid" class="preview" controls></video>
    <div class="field">
      <label>Titlu fișier / clip</label>
      <input id="titlu" placeholder="Nume tutorial video"/>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn green" style="flex:1" id="btnDownload">Descarcă Video</button>
      <button class="btn danger" style="flex:1" id="btnDelete">Șterge / Înregistrează din nou</button>
    </div>
  </div>
</section>

<!-- NAVIGATION -->
<nav class="nav">
  <button data-go="studio" class="active">Studio & Rec</button>
  <button data-go="preview">Previzualizare</button>
</nav>

<div class="toast" id="toast"></div>
</div>

<script>
let state = {
  isRec: false,
  micOn: true,
  aiCut: false,
  stream: null,
  screenStream: null
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  document.querySelector(`.nav button[data-go="${screenId}"]`).classList.add('active');
}

document.querySelectorAll('[data-go]').forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.getAttribute('data-go')));
});

let controlsHidden = false;
document.getElementById('btnHide').addEventListener('click', () => {
  controlsHidden = !controlsHidden;
  document.getElementById('controlPanel').classList.toggle('hidden', controlsHidden);
  document.getElementById('btnHide').textContent = controlsHidden ? 'ARATĂ CONTROALE' : 'ASCUNDE CONTROALE';
});

let audioContext, analyser, microphone, dataArray;

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: {width:{ideal:1280}, height:{ideal:720}}, audio: true});
    state.stream = stream;
    const camVid = document.getElementById('cam');
    camVid.srcObject = stream;
    camVid.play();

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    microphone = audioContext.createMediaStreamSource(stream);
    microphone.connect(analyser);
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    updateVuMeter();
  } catch(e) {
    showToast('Erore la pornirea camerei sau microfonului.');
  }
}
initCamera();

function updateVuMeter() {
  if (analyser && state.micOn) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for(let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
    let avg = sum / dataArray.length;
    let percentage = Math.min(100, Math.round((avg / 128) * 100));
    document.getElementById('vuFill').style.width = percentage + '%';
  } else {
    document.getElementById('vuFill').style.width = '0%';
  }
  requestAnimationFrame(updateVuMeter);
}

const screenVid = document.getElementById('screenShareVid');
document.getElementById('btnShareScreen').addEventListener('click', async () => {
  try {
    const screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      audio: true
    });
    state.screenStream = screenStream;
    screenVid.srcObject = screenStream;
    screenVid.play();
    document.getElementById('btnShareScreen').classList.add('on');
    showToast('Share Screen Full HD activat!');

    screenStream.getVideoTracks()[0].onended = () => {
      stopScreenShare();
    };
  } catch(e) {
    showToast('Partajarea ecranului a fost anulată.');
  }
});

function stopScreenShare() {
  if(state.screenStream) {
    state.screenStream.getTracks().forEach(t => t.stop());
    state.screenStream = null;
  }
  screenVid.srcObject = null;
  document.getElementById('btnShareScreen').classList.remove('on');
}

// AI CUT Toggle - Curăță fundalul menținând utilizatorul complet vizibil
document.getElementById('btnAiCut').addEventListener('click', (e) => {
  state.aiCut = !state.aiCut;
  e.target.classList.toggle('on', state.aiCut);
  e.target.textContent = state.aiCut ? 'AI CUT ON' : 'AI CUT OFF';
  showToast(state.aiCut ? 'AI Cut activat (păstrează întreg utilizatorul)' : 'AI Cut dezactivat');
});

// Cameră interactivă: Free Transform, Drag & Resize
let camBox = { x: 50, y: 50, w: 360, h: 202 };
let isDragging = false;
let isResizing = false;
let dragStartX = 0, dragStartY = 0;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mouseX = (e.clientX - rect.left) * scaleX;
  const mouseY = (e.clientY - rect.top) * scaleY;

  if(mouseX >= camBox.x + camBox.w - 30 && mouseX <= camBox.x + camBox.w + 10 &&
     mouseY >= camBox.y + camBox.h - 30 && mouseY <= camBox.y + camBox.h + 10) {
    isResizing = true;
  } else if(mouseX >= camBox.x && mouseX <= camBox.x + camBox.w && mouseY >= camBox.y && mouseY <= camBox.y + camBox.h) {
    isDragging = true;
    dragStartX = mouseX - camBox.x;
    dragStartY = mouseY - camBox.y;
  }
});

window.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mouseX = (e.clientX - rect.left) * scaleX;
  const mouseY = (e.clientY - rect.top) * scaleY;

  if(isDragging) {
    camBox.x = mouseX - dragStartX;
    camBox.y = mouseY - dragStartY;
  } else if(isResizing) {
    let newW = mouseX - camBox.x;
    if(newW > 120 && newW < canvas.width - camBox.x) {
      camBox.w = newW;
      camBox.h = newW * (9/16);
    }
  }
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  isResizing = false;
});

const camVid = document.getElementById('cam');

// Buffer intern pentru procesare avansată AI Cut fără tăierea utilizatorului
const offScreenCanvas = document.createElement('canvas');
const offCtx = offScreenCanvas.getContext('2d', { willReadFrequently: true });

function drawStudio() {
  if(canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if(state.screenStream && screenVid.readyState === screenVid.HAVE_ENOUGH_DATA) {
    ctx.drawImage(screenVid, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#03070b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#9bb6c9';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Apăsați pe "Share Screen Full HD" pentru a partaja ecranul', canvas.width / 2, canvas.height / 2);
    ctx.textAlign = 'left';
  }

  if(camVid.readyState === camVid.HAVE_ENOUGH_DATA) {
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(camBox.x, camBox.y, camBox.w, camBox.h, 12);
    ctx.clip();

    if(state.aiCut) {
      // AI Cut optimizat: păstrează integral utilizatorul pe ecran, atenuând fundalul din spatele lui
      offScreenCanvas.width = camBox.w;
      offScreenCanvas.height = camBox.h;
      offCtx.drawImage(camVid, 0, 0, camBox.w, camBox.h);
      
      let frame = offCtx.getImageData(0, 0, camBox.w, camBox.h);
      let data = frame.data;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        // Dacă pixelul este deschis la culoare sau aproape de tonurile de piele/haine, îl păstrăm integral; altfel reducem opacitatea fundalului
        let brightness = (r + g + b) / 3;
        if (brightness < 30 || brightness > 230) {
          data[i+3] = Math.max(0, data[i+3] - 120); // Atenuează fundalul lăsând utilizatorul vizibil complet
        }
      }
      offCtx.putImageData(frame, 0, 0);
      ctx.drawImage(offScreenCanvas, camBox.x, camBox.y);
    } else {
      ctx.drawImage(camVid, camBox.x, camBox.y, camBox.w, camBox.h);
    }
    ctx.restore();

    ctx.strokeStyle = '#7ecbff';
    ctx.lineWidth = 3;
    ctx.strokeRect(camBox.x, camBox.y, camBox.w, camBox.h);

    ctx.fillStyle = '#7ecbff';
    ctx.fillRect(camBox.x + camBox.w - 10, camBox.y + camBox.h - 10, 10, 10);
  }

  requestAnimationFrame(drawStudio);
}
requestAnimationFrame(drawStudio);

let mediaRecorder;
let recordedChunks = [];
let isRecording = false;
let recStartTime = 0;
let timerInterval = null;

const recBtn = document.getElementById('recBtn');
recBtn.addEventListener('click', () => {
  if(!isRecording) { startRecording(); } else { stopRecording(); }
});

function startRecording() {
  recordedChunks = [];
  const canvasStream = canvas.captureStream(30);
  
  if(state.stream) {
    state.stream.getAudioTracks().forEach(track => canvasStream.addTrack(track));
  }

  try {
    let options = { mimeType: 'video/mp4', videoBitsPerSecond: 6000000 };
    if (!MediaRecorder.isTypeSupported('video/mp4')) {
      options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 6000000 };
    }

    mediaRecorder = new MediaRecorder(canvasStream, options);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
      document.getElementById('previewVid').src = URL.createObjectURL(blob);
      goTo('preview');
    };
    
    mediaRecorder.start(1000);
    isRecording = true;
    recBtn.classList.add('rec');
    recStartTime = Date.now();
    
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = `${mins}:${secs} / 10:00`;
      if(elapsed >= 600) { stopRecording(); showToast('Limita de 10 minute atinsă.'); }
    }, 1000);

    showToast('Înregistrare pornită');
  } catch(e) {
    showToast('Erore la pornirea înregistrării.');
  }
}

function stopRecording() {
  if(mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    recBtn.classList.remove('rec');
    clearInterval(timerInterval);
    showToast('Înregistrare finalizată!');
  }
}

document.getElementById('btnDownload').addEventListener('click', () => {
  const vid = document.getElementById('previewVid');
  if(!vid.src) return;
  const a = document.createElement('a');
  a.href = vid.src;
  a.download = `${document.getElementById('titlu').value.trim() || 'tutorial'}.mp4`;
  a.click();
});

document.getElementById('btnDelete').addEventListener('click', () => {
  document.getElementById('previewVid').src = '';
  goTo('studio');
});

document.getElementById('btnMic').addEventListener('click', (e) => {
  state.micOn = !state.micOn;
  e.target.classList.toggle('on', state.micOn);
  e.target.textContent = state.micOn ? '🎙 Mic ON' : '🎙 Mic OFF';
  if(state.stream) state.stream.getAudioTracks().forEach(t => t.enabled = state.micOn);
});
</script>
</body>
</html>
